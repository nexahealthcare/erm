<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2F4A9A">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/favicon.png">
  <title>NexaERM — Nexa Health Care</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="nx-progress" id="prog" aria-hidden="true"><i></i></div>
  <div id="boot" class="nx-splash"><div style="text-align:center"><img id="bootLogo" class="nx-logo-full" alt="Nexa Health Care"><div class="nx-skel" style="width:140px;height:6px;margin:18px auto 0"></div></div></div>
  <div id="loginView" class="hide"></div>
  <div id="appView" class="hide"></div>
  <div class="nx-toasts" id="toasts" aria-live="polite"></div>

  <!-- Modal utama (formulir, pratinjau) -->
  <div class="modal fade" id="mdl" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title"></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
    <div class="modal-body"></div><div class="modal-footer"></div></div></div></div>
  <!-- Modal lapis kedua (konfirmasi, pemilih, pratinjau PDF) -->
  <div class="modal fade" id="mdl2" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title"></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
    <div class="modal-body"></div><div class="modal-footer"></div></div></div></div>

  <script async src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
  // Diagnostik muat: tampilkan galat di layar pembuka & beri jalan keluar bila macet.
  (function(){
    function tampil(m){var b=document.getElementById('boot');if(!b||b.classList.contains('hide'))return;
      var d=document.getElementById('bootErr');if(!d){d=document.createElement('div');d.id='bootErr';d.style.cssText='max-width:340px;margin:16px auto 0;font:13px/1.5 system-ui,sans-serif;color:#64748b;text-align:center';b.firstChild.appendChild(d);}
      var n=document.createElement('div');n.style.marginTop='8px';n.innerHTML=m;if(d.children.length<3)d.appendChild(n);}
    window.addEventListener('error',function(e){var w='';try{if(window.__nxSrc&&e.lineno&&!/Failed to execute/.test(e.message||'')){var L=window.__nxSrc.split('\\n')[e.lineno-1]||'',c=Math.max(0,(e.colno||1)-60);w='<br><code style="font-size:11px;word-break:break-all">baris '+e.lineno+':'+e.colno+' &raquo; '+L.slice(c,c+140).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code>';}}catch(x){}tampil('Galat: '+String(e.message||e).replace(/</g,'&lt;')+w+'<br><a href="#" onclick="try{localStorage.clear()}catch(x){};location.reload();return false">Bersihkan data lokal &amp; muat ulang</a>');});
    window.addEventListener('unhandledrejection',function(e){tampil('Galat: '+String((e.reason&&e.reason.message)||e.reason).replace(/</g,'&lt;')+'<br><a href="#" onclick="try{localStorage.clear()}catch(x){};location.reload();return false">Bersihkan data lokal &amp; muat ulang</a>');});
    setTimeout(function(){tampil('Memuat lebih lama dari biasanya…<br><a href="#" onclick="try{localStorage.clear()}catch(x){};location.reload();return false">Muat ulang</a>');},15000);
  })();
  </script>
  <script>window.NX_K = ((location.search.match(/[?&]k=([A-Za-z0-9]{6,12})(?:&|$)/) || [])[1] || '').toUpperCase();</script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
